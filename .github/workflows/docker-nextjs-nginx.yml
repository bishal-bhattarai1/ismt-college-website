name: Build and Deploy Next.js App with Docker and Nginx

on:
  push:
    branches:
      - Development

env:
  IMAGE_NAME: nextjs-app
  CONTAINER_NAME: nextjs_container

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
  
    steps:
      - name: 🔑 Log in to Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
  
      - name: 🚀 Deploy Docker Container via Azure VM Run Command
        run: |
          az vm run-command invoke \
            --resource-group MyResourceGroup \
            --name MyVM \
            --command-id RunShellScript \
            --scripts "
              echo '🛑 Stopping old container (if any)...'
              docker stop nextjs_container || true
  
              echo '🗑️ Removing old container (if any)...'
              docker rm nextjs_container || true
  
              echo '⬇️ Pulling latest image...'
              docker pull ${DOCKER_USERNAME}/nextjs-app:latest
  
              echo '🚀 Starting new container...'
              docker run -d --name nextjs_container -p 3000:3000 \
                -e NODE_ENV=production --restart always \
                ${DOCKER_USERNAME}/nextjs-app:latest
            "

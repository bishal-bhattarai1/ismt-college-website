name: Build and Deploy Next.js App with Docker and Nginx

on:
  push:
    branches:
      - Development

env:
  IMAGE_NAME: nextjs-app
  CONTAINER_NAME: nextjs_container

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
  
    steps:
      - name: 🚀 Deploy to Remote Server via SSH (Password Auth)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 20.57.88.36
          username: bbishal
          password: bishal@12345
          port: 22
          script: |
            echo "🛑 Stopping old container (if any)..."
            docker stop ${{ env.CONTAINER_NAME }} || true
  
            echo "🗑️ Removing old container (if any)..."
            docker rm ${{ env.CONTAINER_NAME }} || true
  
            echo "⬇️ Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
  
            echo "🚀 Starting new container..."
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p 3000:3000 \
              -e NODE_ENV=production \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

version: "3.9"

services:
    nextjs-app:
        container_name: nextjs_container
        build:
           context: . 
           dockerfile: Dockerfile 
        ports:
          - "3000:3000"         
        environment:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
          CUSTOM_SECRET: ${CUSTOM_SECRET}\
        restart: always
                        
